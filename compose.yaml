services:
  postgres:
    image: postgres:16.3-alpine3.20
    environment:
      POSTGRES_DB: denali
      POSTGRES_USER: denali
      POSTGRES_PASSWORD: denali-local
    ports:
      - "55450:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U denali -d denali"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - denali-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DENALI_DSN: postgresql://denali:denali-local@postgres:5432/denali
      DENALI_TENANT_ID: 00000000-0000-4000-8000-000000000001
    ports:
      - "8088:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  denali-postgres:
